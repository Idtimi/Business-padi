<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Business Padi</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2.5rem 2rem; max-width: 480px; width: 100%; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        .btn { display: inline-block; background: #0b8457; color: white; padding: 0.6rem 1.25rem; border-radius: 6px; text-decoration: none; font-weight: 600; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"></div>
        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">{{ title or "Access Error" }}</h2>
        <p style="color: #64748b; font-size: 0.95rem; line-height: 1.5;">
            {{ message or "An error occurred while processing your request." }}
        </p>
        <a href="/d" class="btn">Return to Dashboard</a>
    </div>
</body>
</html>
